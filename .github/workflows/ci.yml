name: CI - LAB40 (Feature 18)

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalação reproduzível de dependências
        run: npm ci

      - name: Análise estática (ESLint)
        run: npm run lint

      - name: Testes automatizados (node:test)
        run: npm run test:spec

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Smoke test da API
        run: npm run test:smoke

  docker:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build --pull -t lab40:feature18 .

      - name: Testar container efêmero (/health e /api/features/18)
        run: |
          docker run -d --name lab40-ci-container -p 3000:3000 lab40:feature18
          trap 'docker logs lab40-ci-container || true; docker stop lab40-ci-container || true; docker rm lab40-ci-container || true' EXIT
          for i in $(seq 1 15); do
            if curl --fail -s http://localhost:3000/health; then
              break
            fi
            sleep 1
          done
          curl --fail -s http://localhost:3000/health
          curl --fail -s -X POST http://localhost:3000/api/features/18 \
            -H "Content-Type: application/json" \
            -d '{"valores":[8,2,5]}' | grep -q '"maior":8'

      - name: Exportar imagem Docker como artefato
        run: docker save lab40:feature18 -o lab40-feature18.tar

      - name: Publicar artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: lab40-feature18-image
          path: lab40-feature18.tar
